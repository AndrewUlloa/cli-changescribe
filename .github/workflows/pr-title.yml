name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out the trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install trusted base dependencies
        run: npm ci --ignore-scripts

      - name: Build the trusted title validator
        run: npm run build

      - name: Validate pull-request title
        run: node ./bin/diffwright.js title-check --event-file "$GITHUB_EVENT_PATH"
